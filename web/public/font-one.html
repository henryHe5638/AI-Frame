<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body><pre id="out">start</pre>
<script>
const out = (m) => { document.getElementById("out").textContent += "\n" + m; console.log(m); };
(async () => {
  const t0 = performance.now();
  try {
    const r = await fetch("/fonts/ALIBABA-PUHUITI-REGULAR.OTF");
    const buf = await r.arrayBuffer();
    out(`fetch ok ${buf.byteLength}B in ${(performance.now()-t0).toFixed(0)}ms`);
    const t1 = performance.now();
    const face = new FontFace("TESTFONT1", buf);
    await face.load();
    document.fonts.add(face);
    out(`FontFace(buffer) ok in ${(performance.now()-t1).toFixed(0)}ms status=${face.status}`);
  } catch (e) { out("ERR buffer: " + e.message); }
  try {
    const t2 = performance.now();
    const face2 = new FontFace("TESTFONT2", "url(/fonts/FZSTJW.TTF)");
    await face2.load();
    document.fonts.add(face2);
    out(`FontFace(url) ok in ${(performance.now()-t2).toFixed(0)}ms status=${face2.status}`);
  } catch (e) { out("ERR url: " + e.message); }
})();
</script></body></html>
